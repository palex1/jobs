<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Έξυπνο Dashboard Αγγελιών</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4" x-data="jobApp({jobs: [{"id": 10, "title": "ΑΝΑΚΟΙΝΩΣΗ υπ’ αριθ. ΣΜΕ 12/2026 για τη σύναψη ΣΥΜΒΑΣΗΣ ΜΙΣΘΩΣΗΣ ΕΡΓΟΥ", "link": "https://www.ppel.gov.gr/anakinosi-ip-arith-sme-12-2026-gia-ti-sinapsi-simvasis-misthosis-ergou/", "source": "Περιφέρεια Πελοποννήσου", "date": "2026-11-15 18:04:59"}, {"id": 9, "title": "ΠΡΟΚΗΡΥΞΗ ΑΝΟΙΚΤΗΣ ΔΙΑΔΙΚΑΣΙΑΣ ΜΕΣΩ ΤΟΥ ΕΘΝΙΚΟΥ ΣΥΣΤΗΜΑΤΟΣ ΗΛΕΚΤΡΟΝΙΚΩΝ ΔΗΜΟΣΙΩΝ ΣΥΜΒΑΣΕΩΝ (Ε.Σ.Η.ΔΗ.Σ.) ΓΙΑ ΤΗΝ ΚΑΤΑΣΚΕΥΗ ΤΟΥ ΕΡΓΟΥ «ΣΥΝΤΗΡΗΣΗ, ΚΑΘΑΡΙΣΜΟΣ ΚΑΙ ΑΠΟΚΑΤΑΣΤΑΣΗ ΤΕΧΝΙΚΩΝ ΕΡΓΩΝ ΠΟΤΑΜΟΥ ΕΥΡΩΤΑ ΚΑΙ ΠΑΡΑΚΕΙΜΕΝΩΝ ΧΕΙΜΑΡΡΩΝ ΣΤΗΝ Π.Ε. ΛΑΚΩΝΙΑΣ»", "link": "https://www.ppel.gov.gr/prokirixi-aniktis-diadikasias-meso-tou-ethnikou-sistimatos-ilektronikon-dimosion-simvaseon-e-s-i-di-s-gia-tin-kataskevi-tou-ergou-sintirisi-katharismos-ke-apokatastasi-technikon-ergon-potamo/", "source": "Περιφέρεια Πελοποννήσου", "date": "2026-11-15 18:04:59"}, {"id": 8, "title": "Ανοιχτή συνάντηση εργασίας από την Ελληνική Ομάδα Διάσωσης Α…", "link": "https://kalimera-arkadia.gr/atzenta/item/195198-anoixti-synantisi-ergasias-apo-tin-elliniki-omada-diasosis-arkadias.html", "source": "Καλημέρα Αρκαδία", "date": "2026-11-15 18:04:58"}, {"id": 7, "title": "Δήμος Τρίπολης | Πίνακας κατάταξης και βαθμολογίας για την προκήρυξη ΣΟΧ 1/2026", "link": "https://kalimera-arkadia.gr/theseis-ergasias/item/193427-dimos-tripolis-pinakas-katataksis-kai-vathmologias-gia-tin-prokiryksi-sox-1-2026.html", "source": "Καλημέρα Αρκαδία", "date": "2026-11-15 18:04:58"}, {"id": 6, "title": "Νέα θέση εργασίας για υπαλλήλο μπουφέ στα ΣΕΑ Νεστάνης!", "link": "https://kalimera-arkadia.gr/theseis-ergasias/item/194333-nea-thesi-ergasias-gia-ypallilo-boufe-sta-sea-nestanis.html", "source": "Καλημέρα Αρκαδία", "date": "2026-11-15 18:04:58"}, {"id": 5, "title": "Νέα θέση εργασίας για εξυπηρέτηση πελατών", "link": "https://kalimera-arkadia.gr/theseis-ergasias/item/194622-nea-thesi-ergasias-gia-eksypiretisi-pelaton.html", "source": "Καλημέρα Αρκαδία", "date": "2026-11-15 18:04:58"}, {"id": 4, "title": "Επτά θέσεις εργασίας στον Δήμο και στη ΔΕΥΑ Βόρειας Κυνουρίας μέσω ΑΣΕΠ", "link": "https://kalimera-arkadia.gr/theseis-ergasias/item/194868-epta-theseis-ergasias-ston-dimo-kai-sti-deva-voreias-kynourias-meso-asep.html", "source": "Καλημέρα Αρκαδία", "date": "2026-11-15 18:04:58"}, {"id": 3, "title": "Αγγελία εργασίας | Ζητείται διανομέας courier για πλήρη απασχόληση", "link": "https://kalimera-arkadia.gr/theseis-ergasias/item/194916-aggelia-ergasias-ziteitai-dianomeas-courier-gia-pliri-apasxolisi.html", "source": "Καλημέρα Αρκαδία", "date": "2026-11-15 18:04:58"}, {"id": 2, "title": "Νέα θέση εργασίας για αποθηκάριο", "link": "https://kalimera-arkadia.gr/theseis-ergasias/item/195153-nea-thesi-ergasias-gia-apothikario.html", "source": "Καλημέρα Αρκαδία", "date": "2026-11-15 18:04:58"}, {"id": 1, "title": "Θεσεις εργασιας", "link": "https://kalimera-arkadia.gr/theseis-ergasias.html", "source": "Καλημέρα Αρκαδία", "date": "2026-11-15 18:04:58"}]})">
    <div class="max-w-4xl mx-auto">
        
        <!-- HEADER -->
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-extrabold text-slate-800">💼 Dashboard Αγγελιών & Προκηρύξεων</h1>
            <p class="text-slate-500 mt-1">Αυτόματη παρακολούθηση & έξυπνη αποθήκευση</p>
        </header>

        <!-- SEARCH & TABS -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-6 border border-slate-100 space-y-4">
            <div class="relative">
                <input type="text" x-model="search" placeholder="🔍 Αναζήτηση με λέξη-κλειδί (π.χ. Πληροφορική, ΣΟΧ, Δήμος)..." 
                    class="w-full px-4 py-3 pl-12 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <span class="absolute left-4 top-3.5 text-slate-400">⚡</span>
            </div>

            <div class="flex flex-wrap gap-2 justify-between items-center pt-2 border-t border-slate-100">
                <div class="flex flex-wrap gap-2">
                    <button @click="currentTab = 'all'" :class="currentTab === 'all' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                        Όλες (<span x-text="jobs.length"></span>)
                    </button>
                    <button @click="currentTab = 'saved'" :class="currentTab === 'saved' ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                        ⭐ Αγαπημένες (<span x-text="savedIds.length"></span>)
                    </button>
                    <button @click="currentTab = 'ppel'" :class="currentTab === 'ppel' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                        Περιφέρεια Πελοποννήσου
                    </button>
                    <button @click="currentTab = 'kalimera'" :class="currentTab === 'kalimera' ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                        Καλημέρα Αρκαδία
                    </button>
                </div>
            </div>
        </div>

        <!-- LIST OF JOBS -->
        <div class="bg-white shadow-lg rounded-xl overflow-hidden border border-slate-100">
            <div class="divide-y divide-slate-100" x-show="filteredJobs.length > 0">
                <template x-for="job in filteredJobs" :key="job.id">
                    <div class="p-5 hover:bg-slate-50 transition flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full" 
                                    :class="job.source.includes('Περιφέρεια') ? 'bg-emerald-100 text-emerald-800' : 'bg-sky-100 text-sky-800'" 
                                    x-text="job.source"></span>
                                <span class="text-xs text-slate-400" x-text="'Καταγράφηκε: ' + job.date"></span>
                            </div>
                            <h2 class="text-base font-semibold text-slate-800" x-text="job.title"></h2>
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                            <button @click="toggleSave(job.id)" class="p-2 rounded-lg border transition text-sm"
                                :class="savedIds.includes(job.id) ? 'bg-amber-50 border-amber-300 text-amber-500' : 'bg-white border-slate-200 text-slate-400 hover:text-amber-500'"
                                :title="savedIds.includes(job.id) ? 'Αφαίρεση από αγαπημένα' : 'Αποθήκευση στα αγαπημένα'">
                                <span x-text="savedIds.includes(job.id) ? '⭐' : '☆'"></span>
                            </button>
                            <a :href="job.link" target="_blank" class="px-4 py-2 bg-blue-600 text-white text-xs font-medium rounded-lg hover:bg-blue-700 transition shadow-sm whitespace-nowrap">
                                Άνοιγμα →
                            </a>
                        </div>
                    </div>
                </template>
            </div>

            <!-- EMPTY STATE -->
            <div class="p-12 text-center text-slate-400" x-show="filteredJobs.length === 0">
                Δεν βρέθηκαν αγγελίες που να ταιριάζουν με τα κριτήρια.
            </div>
        </div>

    </div>

    <script>
        function jobApp(data) {
            return {
                jobs: data.jobs,
                search: '',
                currentTab: 'all',
                savedIds: JSON.parse(localStorage.getItem('saved_job_ids') || '[]'),

                toggleSave(id) {
                    if (this.savedIds.includes(id)) {
                        this.savedIds = this.savedIds.filter(i => i !== id);
                    } else {
                        this.savedIds.push(id);
                    }
                    localStorage.setItem('saved_job_ids', JSON.stringify(this.savedIds));
                },

                get filteredJobs() {
                    return this.jobs.filter(job => {
                        let matchesSearch = job.title.toLowerCase().includes(this.search.toLowerCase());
                        
                        let matchesTab = true;
                        if (this.currentTab === 'saved') {
                            matchesTab = this.savedIds.includes(job.id);
                        } else if (this.currentTab === 'ppel') {
                            matchesTab = job.source.includes('Περιφέρεια');
                        } else if (this.currentTab === 'kalimera') {
                            matchesTab = job.source.includes('Καλημέρα');
                        }

                        return matchesSearch && matchesTab;
                    });
                }
            }
        }
    </script>
</body>
</html>
